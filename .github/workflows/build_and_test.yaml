# Workflow para instalar dependencias y ejecutar pruebas al hacer push en la rama master
# Documentación oficial: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build and Test

on:
  push:
    branches: ["master"] # Se activa cuando hay un push a la rama master
  pull_request:
    branches: ["master"] # Ejecuta también en pull requests a la rama master

permissions:
  contents: read # Permisos de lectura sobre el contenido del repositorio

jobs:
  build_and_test:
    runs-on: ubuntu-latest # Ejecuta el trabajo en un runner con Ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Descarga el código fuente en el runner

      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # Configura el entorno de Python 3.11
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Instala dependencias (pytest)

      - name: Test with pytest
        run: pytest test_prueba.py # Ejecuta las pruebas en la raíz del proyecto


