# Workflow para testing, linting y publicación del contenedor Docker en GHCR para la rama master
# Repositorio: https://github.com/Eduardo342-Git/Miweb.git

name: Build, Test and Push Container

on:
  push:
    branches: ["master"] # Se activa cuando hay un push a la rama master
  pull_request:
    branches: ["master"] # Se activa en pull requests a la rama master

permissions:
  contents: read # Lectura del código del repositorio
  packages: write # Permiso necesario para publicar imágenes en GitHub Container Registry (GHCR)

jobs:
  build_test_and_push:
    runs-on: ubuntu-latest # Ejecuta en una máquina virtual de Ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Descarga el código del repositorio

      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # Configura el entorno Python 3.11
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Instala pytest y ruff

      - name: Test with pytest
        run: pytest test_prueba.py # Ejecuta los tests unitarios

      - name: Lint code with Ruff
        run: ruff check . # Ejecuta el linter Ruff

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Configura Docker Buildx para construcciones avanzadas

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3 # Inicia sesión en el registro de contenedores de GitHub
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6 # Construye y publica la imagen en GHCR
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }} # Solo hace push si no es una pull request
          tags: |
            ghcr.io/eduardo342-git/miweb:latest
            ghcr.io/eduardo342-git/miweb:v1.0.0
            ghcr.io/eduardo342-git/miweb:${{ github.sha }}
